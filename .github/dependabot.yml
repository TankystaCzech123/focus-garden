version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    # Expo SDK pins these together; upgrade them with `npx expo install --fix` instead.
    ignore:
      - dependency-name: "expo*"
      - dependency-name: "react"
      - dependency-name: "react-native*"
      - dependency-name: "@types/react"
    groups:
      dev-dependencies:
        dependency-type: development
