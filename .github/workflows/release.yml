name: Release

# Every push to main that changes the app builds the APK and publishes a new GitHub release
# automatically (version 0.1.<run number>), so the in-app "check for updates" button can install it.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'modules/**'
      - 'assets/**'
      - 'App.tsx'
      - 'index.ts'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Set version
        id: ver
        run: |
          VERSION="0.1.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node -e 'const f="app.json",j=require("./"+f);j.expo.version=process.argv[1];j.expo.android.versionCode=Number(process.argv[2]);require("fs").writeFileSync(f,JSON.stringify(j,null,2)+"\n")' "$VERSION" "${{ github.run_number }}"
      - run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -i "SHA-256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "focus-garden-v${VERSION}-arm64-v8a.apk"
          gh release create "v${VERSION}" "focus-garden-v${VERSION}-arm64-v8a.apk" \
            --target "$GITHUB_SHA" --title "v${VERSION}" --generate-notes
